version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: abps-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: abps_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: abps-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/abps_db
      - SECRET_KEY=ir-abps-production-super-secret-key
      - TRAIN_DATA_MODE=mock
      - RAILRADAR_API_KEY=rg_3831164541ac4980ac482afe8d396989
      - CORS_ORIGINS=["*"]
      - BUFFER_BEFORE_MIN=5
      - BUFFER_AFTER_MIN=5
      - SOLVER_TIME_LIMIT_SECONDS=15
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: abps-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
